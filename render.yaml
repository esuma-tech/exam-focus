# EXAM FOCUS — Render Blueprint for the FastAPI backend
# Docs: https://render.com/docs/blueprint-spec
# Deploy: connect the GitHub repo in the Render dashboard and use this file,
# or run `render blueprint launch` from a machine with the Render CLI.
services:
  - type: web
    name: exam-focus-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false